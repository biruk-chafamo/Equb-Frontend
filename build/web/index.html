<!DOCTYPE html>
<html>
  <meta http-equiv="Content-Security-Policy" content="upgrade-insecure-requests">
<head>
  <!--
    If you are serving your web app in a path other than the root, change the
    href value below to reflect the base path you are serving from.

    The path provided below has to start and end with a slash "/" in order for
    it to work correctly.

    For more details:
    * https://developer.mozilla.org/en-US/docs/Web/HTML/Element/base

    This is a placeholder for base href that will be replaced by the value of
    the `--base-href` argument provided to `flutter build`.
  -->
  <base href="/">

  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="description" content="A new Flutter project.">

  <!-- Google Sign-In web client ID -->
  <meta name="google-signin-client_id" content="569022884663-5vk5oa870n2vavomejsc7ltq8je5t1on.apps.googleusercontent.com">

  <!-- iOS meta tags & icons -->
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black">
  <meta name="apple-mobile-web-app-title" content="equb_v3_frontend">
  <link rel="apple-touch-icon" href="icons/equb_logo.png">

  <!-- Favicon -->
  <link rel="icon" type="image/png" href="icons/equb_logo.png"/>

  <title>Equb Finance</title>
  <link rel="manifest" href="manifest.json">

  <script>
    // Hardcoded locally to work around a Flutter 3.44.8 dev-server bug where the
    // injected deprecation message contains an unescaped apostrophe, breaking this
    // string literal. Not needed for local dev testing.
    const serviceWorkerVersion = "180990865" /* Flutter's service worker is deprecated and will be removed in a future Flutter release. */;
  </script>
  <!-- This script adds the flutter initialization JS code -->
  <script src="flutter.js" defer></script>
</head>
<body>
  <script>
    window.addEventListener('load', function(ev) {
      // Download main.dart.js
      _flutter.loader.loadEntrypoint({
        serviceWorker: {
          serviceWorkerVersion: serviceWorkerVersion,
        },
        onEntrypointLoaded: function(engineInitializer) {
          engineInitializer.initializeEngine().then(function(appRunner) {
            appRunner.runApp();
          });
        }
      });
    });
  </script>
</body>
</html>
