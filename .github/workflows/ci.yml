name: ci

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  analyze-and-test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7

      - id: pin
        run: echo "version=$(jq -r .flutter .fvmrc)" >> "$GITHUB_OUTPUT"

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ steps.pin.outputs.version }}
          channel: stable
          cache: true

      - run: flutter --version
      - run: flutter pub get
      - run: flutter analyze
      - run: flutter test --reporter expanded --coverage

      - name: Reject pumpAndSettle
        run: |
          if grep -rn "\.pumpAndSettle(" test/; then
            echo "pumpAndSettle hangs on this app's shimmer and countdown widgets."
            echo "Use pumpFrames / pumpUntilFound from test/support/harness/pump_helpers.dart."
            exit 1
          fi

      - name: Assert build output untouched
        run: git diff --exit-code -- build/

      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: lcov
          path: coverage/lcov.info

  deploy:
    needs: analyze-and-test
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7

      - id: pin
        run: echo "version=$(jq -r .flutter .fvmrc)" >> "$GITHUB_OUTPUT"

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ steps.pin.outputs.version }}
          channel: stable
          cache: true

      - run: flutter pub get

      - run: tool/verify_web_build.sh --no-serve

      - name: Push the built bundle to heroku
        env:
          HEROKU_API_KEY: ${{ secrets.HEROKU_API_KEY }}
        run: |
          if [ -z "$HEROKU_API_KEY" ]; then
            echo "HEROKU_API_KEY is not set" >&2
            exit 1
          fi

          staging="$(mktemp -d)"
          mkdir -p "$staging/build"
          cp -r build/web "$staging/build/web"
          cp Procfile package.json "$staging/"

          cd "$staging"
          git init -q
          git checkout -q -b main
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -q -m "build from ${GITHUB_SHA::7}"
          git push -q --force \
            "https://heroku:$HEROKU_API_KEY@git.heroku.com/equb-finance-web.git" \
            main
